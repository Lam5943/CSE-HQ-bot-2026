[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cse-hq-bot"
version = "0.1.0"
description = "CSE-HQ Discord bot MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4.0,<3",
  "python-dotenv>=1.0.1,<2",
  "google-generativeai>=0.8.0,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-cov>=5.0.0,<6"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
