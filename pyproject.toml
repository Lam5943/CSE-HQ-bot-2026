[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cse-hq-bot"
version = "0.1.0"
description = "CSE-HQ Discord bot MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10.0,<4",
  "discord.py>=2.4.0,<3",
  "python-dotenv>=1.0.1,<2",
  "google-genai>=1.0.0,<2",
  "openai>=2.0.0,<3"
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.0,<2",
  "pip-audit>=2.10.0,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.16.0,<1"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
